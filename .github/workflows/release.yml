on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - run: |
          xmake global --policies=package.precompiled:n

      - run: |
          xmake repo -u
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - id: package-repositories
        shell: pwsh
        run: |
          $revisions = Get-ChildItem "$env:LOCALAPPDATA/.xmake/repositories" -Directory |
            Sort-Object Name |
            ForEach-Object {
              $revision = git -C $_.FullName rev-parse HEAD
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to resolve $($_.Name) repository revision"
              }
              "$($_.Name)-$revision"
            }
          if (-not $revisions) {
            throw "No xmake package repositories were found"
          }
          "revisions=$($revisions -join '-')" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-packages-source-${{ runner.os }}-${{ steps.package-repositories.outputs.revisions }}-${{ hashFiles('xmake.lua') }}

      - run: |
          xmake f -a x64 -m release -p windows --target_type=client -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - run: |
          xmake -w -y
        env:
          XMAKE_PKG_CACHEDIR: ${{ runner.temp }}/xmake-package-cache-${{ github.run_id }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            bin/

  update-release-notes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: extract-release-notes
        uses: ffurrer2/extract-release-notes@v3

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            ${{ steps.extract-release-notes.outputs.release_notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: artifact

      - run: |
          mv artifact/playback-ui.mcpack playback-ui.mcpack
          cp CHANGELOG.md LICENSE README.md README_ZH.md artifact/

      - run: |
          zip -r ../${{ github.event.repository.name }}-client-windows-x64.zip *
        working-directory: artifact

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.event.repository.name }}-client-windows-x64.zip
            playback-ui.mcpack

  notify-discord:
    needs:
      - build
      - update-release-notes
      - upload-to-release
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          NOTES_RESULT: ${{ needs.update-release-notes.result }}
          UPLOAD_RESULT: ${{ needs.upload-to-release.result }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            Write-Warning "DISCORD_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          }

          $results = @($env:BUILD_RESULT, $env:NOTES_RESULT, $env:UPLOAD_RESULT)
          $succeeded = ($results | Where-Object { $_ -ne "success" }).Count -eq 0
          $payload = @{
            username = "Playback GitHub"
            allowed_mentions = @{ parse = @() }
            embeds = @(
              @{
                title = if ($succeeded) { "Release $($env:RELEASE_TAG) published" } else { "Release $($env:RELEASE_TAG) workflow failed" }
                url = if ($succeeded) { $env:RELEASE_URL } else { $env:RUN_URL }
                color = if ($succeeded) { 5763719 } else { 15548997 }
                fields = @(
                  @{ name = "Repository"; value = $env:REPOSITORY; inline = $true }
                  @{ name = "Tag"; value = $env:RELEASE_TAG; inline = $true }
                  @{ name = "Triggered by"; value = $env:ACTOR; inline = $true }
                )
                timestamp = (Get-Date).ToUniversalTime().ToString("o")
              }
            )
          } | ConvertTo-Json -Depth 6

          Invoke-RestMethod `
            -Uri $env:DISCORD_WEBHOOK_URL `
            -Method Post `
            -ContentType "application/json" `
            -Body $payload
